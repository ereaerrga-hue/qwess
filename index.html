<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HoraCoins</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">

    <style> body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #000000, #444444);
        color: #fff;
        font-family: sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--tg-viewport-height);
    }
    </style>

    <style>
        .button-inner {
            transition: transform 0.1s ease;
        }

        .button-cash:active .button-inner {
            transform: scale(0.9);
        }

        .button-cash{

            animation: upDown 3s 0s infinite ease-in-out;
        }

        @keyframes upDown {
            0%, 100% { transform: translateY(0);}
            50%      { transform: translateY(-20px);}
        }

        .button-inner {
            position: absolute;
            left: -155px;
            bottom: -200px;
            width: min(75vw, 340px);
        }
    </style>

    <style>
        .clik{
            position: absolute;
            top: 180px;
            color: dimgrey;
            border-radius: 50px;
            font-family: "Calibri",serif;
            touch-action: manipulation;
        }

    </style>

    <style>
        .you-chek {
            position: absolute;
            top: 160px;
            color: dimgray;
            font-family: "Calibri",serif;
        }
    </style>

    <style>
        .Chek-img {
            position: absolute;
            top: 200px;
            right: 1182px;
            width: min(75vw, 30px);
        }
    </style>

    <style>
        .button-shop {
            position: absolute;
            top: 250px;
            right: 1335px;
            height: 90px;
            width: 90px;
            border-radius: 20%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);

            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                    inset 0 1px 1px rgba(255, 255, 255, 0.4),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.05),
                    0 8px 24px rgba(0, 0, 0, 0.3);
        }

         .button-shop {
             transition: transform 0.1s ease;
         }

        .button-shop:active {
            transform: scale(0.9);
        }

    </style>

    <style>
        .button-ofter {
            position: absolute;
            top: 250px;
            right: 1230px;
            height: 90px;
            width: 90px;
            border-radius: 20%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);

            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                    inset 0 1px 1px rgba(255, 255, 255, 0.4),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.05),
                    0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .button-ofter {
            transition: transform 0.1s ease;
        }

        .button-ofter:active {
            transform: scale(0.9);
        }

    </style>

    <style>
        .button-upgrader {
            position: absolute;
            top: 250px;
            right: 1125px;
            height: 90px;
            width: 90px;
            border-radius: 20%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);

            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                    inset 0 1px 1px rgba(255, 255, 255, 0.4),
                    inset 0 -1px 1px rgba(255, 255, 255, 0.05),
                    0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .button-upgrader {
            transition: transform 0.1s ease;
        }

        .button-upgrader:active {
            transform: scale(0.9);
        }

    </style>

    <style>
        .upgrader-icon {
            position: absolute;
            top: 0;
            right: 0;
        }
    </style>

</head>
<body>

<div class="you-chek">
    <h4>Твой счёт</h4>
        </div>

<div class="clik">
    <h2><span id="counter">0.000000000</span></h2>
        </div>

<div class="button-cash">
    <button id="btn" style="border: none; background: transparent">
        <img class="button-inner" src="https://www.pngarts.com/files/3/Silver-Coin-Free-PNG-Image.png" alt="Cash">
    </button>
        </div>

    <img class="Chek-img" src="https://www.pngarts.com/files/3/Silver-Coin-Free-PNG-Image.png" alt="Chek">

        <button class="button-shop">
        </button>

        <button class="button-ofter">
        </button>

    <div class="upgrader-icon">
        <button class="button-upgrader">
            <img style="height: 60px;" src="https://cdn-icons-png.flaticon.com/128/8718/8718771.png" alt="upgrader">
        </button>
    </div>

    <script>
        let count = 0.000000000;

        const btn = document.getElementById('btn');
        const counter = document.getElementById('counter');
        const STEP =1e9;

        btn.addEventListener('click', () => {
            count++;
            counter.innerText = (count / STEP).toFixed(9);

        });
    </script>

    <script>
    (function () {
        const w = /** @type {any} */ (window);
        const tg = w.Telegram && w.Telegram.WebApp;
        if (!tg) return;
        tg.ready();
        tg.expand();
        const syncVh = () => {
            document.documentElement.style.setProperty('--tg-viewport-height', tg.viewportHeight + 'px');
        };
        syncVh();
        tg.onEvent('viewportChanged', syncVh);
    })();
    </script>

</body>
<footer>

</footer>
</html>
